[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finpredict"
version = "4.5.0"
description = "Market prediction engine with crash probability analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "yfinance>=0.2.18",
    "fredapi>=0.5.0",
    "finnhub-python>=2.4.18",
    "hmmlearn>=0.3.0",
    "arch>=6.0",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "reportlab>=4.0",
    "requests>=2.31",
    "fear-and-greed>=0.0.4",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "jupyter>=1.0",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "celery>=5.3",
    "redis>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
